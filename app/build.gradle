plugins { id 'com.android.application' }
def signingProps = new Properties()
def signingPropsFile = rootProject.file('signing.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
android {
    namespace 'cn.xingce.timer'
    compileSdk 35
    defaultConfig { applicationId 'cn.xingce.timer'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.0.1' }
    signingConfigs {
        if (signingPropsFile.exists()) {
            localRelease { storeFile rootProject.file(signingProps['storeFile']); storePassword signingProps['storePassword']; keyAlias signingProps['keyAlias']; keyPassword signingProps['keyPassword'] }
        }
    }
    buildTypes { release { minifyEnabled false; if (signingPropsFile.exists()) signingConfig signingConfigs.localRelease } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

