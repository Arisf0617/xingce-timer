-bottom:19px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.module-list{display:grid;grid-template-columns:1fr;gap:10px}.module{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 15px 12px;min-height:66px;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;transition:background .2s,border-color .2s}.module.selected{border-color:#bdcaff;background:#f4f6ff}.module .number{color:var(--c);background:#f0f3fe;background:color-mix(in srgb,var(--c) 9%,white);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:700}.module b{font-size:13px;font-weight:600}.module small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.module .value{text-align:right;font-size:18px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.module .value small{font-size:10px;font-weight:400;letter-spacing:0}.module .bar{position:absolute;left:56px;right:15px;bottom:0;height:2px;background:#f0f2f7;overflow:hidden}.module .bar i{display:block;height:100%;background:var(--c);max-width:100%;transition:width .3s}.overtime{color:var(--red)!important}.empty{padding:75px 20px;text-align:center;color:var(--muted)}.empty-icon{width:64px;height:64px;display:grid;place-items:center;border-radius:22px;background:#edf1fc;color:#9baee7;margin:0 auto 18px}.empty h2{color:var(--ink);font-size:18px;font-weight:600}.empty p{font-size:12px;line-height:1.8}.record-list{display:grid;gap:12px}.record{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border-radius:18px;background:white;border:1px solid white}.record h3{font-size:15px;margin:0 0 7px}.record p{font-size:11px;color:var(--muted);margin:0}.record .record-time{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}.record em{font-style:normal;font-size:10px;color:var(--muted);display:block;text-align:right;margin-top:4px}.record-right{display:flex;align-items:center;gap:17px}.chart-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;padding:30px}.pie-wrap{max-width:300px;width:100%;margin:auto}.pie-wrap svg{width:100%;height:auto;filter:drop-shadow(0 7px 9px #243b6310)}.legend{display:grid;gap:0}.legend-row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:12px;align-items:center}.legend-row:last-child{border:0}.legend-name{display:flex;align-items:center;gap:9px}.swatch{width:8px;height:8px;border-radius:3px}.legend-row b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.legend-row small{display:inline-block;width:42px;text-align:right;color:var(--muted);font-size:10px}.stats-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:20px}.stat{padding:22px}.stat strong{font-size:29px;letter-spacing:-1px;display:block;margin-top:9px;font-variant-numeric:tabular-nums}.stat strong small{font-size:11px;letter-spacing:0;color:var(--muted);margin-left:5px}.chart-card h2{font-size:16px;padding:24px 25px 0;margin:0}.chart-note{font-size:11px;color:var(--muted);padding:0 25px 23px;margin:0;line-height:1.8}.detail-meta{display:flex;gap:25px;padding:22px 25px;border-bottom:1px solid var(--line)}.detail-meta strong{display:block;font-size:21px;margin-top:5px}.detail-actions{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.danger{color:var(--red);font-size:12px}.back{display:flex;align-items:center;gap:5px;padding:0;font-size:13px;color:var(--blue)}.overlay{display:none;position:fixed;inset:0;background:#18233d66;z-index:5;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(4px)}.overlay.open{display:flex}.dialog{background:white;border-radius:24px;padding:25px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 80px #101b3330}.dialog h2{font-size:21px;margin:0 0 8px}.dialog p{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 15px}.dialog label{font-size:12px;display:flex;align-items:center;justify-content:space-between;margin:9px 0;gap:12px}.dialog input{border:1px solid #e0e5f0;border-radius:10px;padding:8px 11px;color:var(--ink);width:95px;text-align:right;background:#fafbfe}.dialog input.wide{width:100%;text-align:left;margin:6px 0 12px}.dialog .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.preset{display:flex;gap:8px;margin:15px 0}.preset button{flex:1;background:#f0f3fe;border-radius:10px;color:var(--blue);font-size:12px}.budget-fields{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}.budget-error{font-size:11px;color:var(--red);min-height:18px;margin-top:10px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#202a43;color:white;border-radius:12px;padding:12px 20px;z-index:10;font-size:12px;max-width:90%;display:none}.no-data{font-size:13px;color:var(--muted);text-align:center;padding:35px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:900px){.module{min-height:72px}.modules-card{display:flex;flex-direction:column}.module-list{flex:1}.module{padding-top:16px;padding-bottom:16px}}
@media(max-width:699px){header{padding:19px 18px 15px}.brand b{font-size:18px}.brand small{font-size:9px}.mark{width:35px;height:35px;border-radius:11px}.nav button{padding:6px 11px;font-size:12px}.nav svg{display:none}main{padding:2px 17px 26px}.page-heading{margin:8px 0 15px}.page-heading h1{font-size:22px}.layout{grid-template-columns:1fr;gap:15px}.timer-card{padding:19px 20px 16px}.dial{width:245px;margin:9px 0 8px}.time{font-size:55px}.timer-bottom{padding:12px 0}.timer-bottom strong{font-size:16px}.hint{margin-top:11px}.modules-card{padding:19px 16px}.section-head{margin-bottom:14px}.module-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.module{grid-template-columns:1fr auto;padding:12px 11px 11px;gap:4px;min-height:101px}.module .number{display:none}.module b{grid-column:1/-1;font-size:12px}.module small{font-size:9px;margin-top:4px}.module .value{grid-column:1/-1;text-align:left;font-size:21px;margin-top:3px}.module .value small{display:inline;margin-left:7px;font-size:9px}.module .bar{left:11px;right:11px}.chart-layout{grid-template-columns:1fr;gap:15px;padding:25px}.pie-wrap{max-width:230px}.legend-row{padding:12px 0}.stats-summary{gap:10px}.stat{padding:18px}.stat strong{font-size:25px}.detail-meta{gap:22px;padding:20px}.detail-meta strong{font-size:18px}.record{padding:18px}.record .record-time{font-size:21px}.record-right{gap:8px}}
@media(max-width:350px){header{padding-left:13px;padding-right:13px}.brand small{display:none}.nav button{padding:6px 9px}.brand b{font-size:16px}main{padding-left:12px;padding-right:12px}.time{font-size:50px}.module .value small{display:block;margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:699px){header{padding-top:14px;padding-bottom:14px}.brand small{display:none}#timer>.page-heading{display:none}.timer-card{padding:16px 20px 14px}.timer-top .text-button{min-height:32px}.dial{width:195px;height:195px;margin:8px 0}.time{font-size:47px;letter-spacing:-2px}.dial-center .badge{margin-top:8px}.timer-label{margin-bottom:5px}.module{min-height:76px;padding:9px 11px 8px;gap:1px}.module b{font-size:12px}.module .value{font-size:19px;margin-top:1px}.module small{font-size:9px;margin-top:2px}.modules-card{padding:16px}.section-head{margin-bottom:10px}.module-list{gap:8px}.hint{margin-top:9px}}.eyebrow{display:none}.brand small:empty{display:none}</style></head><body>
<header><div class="brand"><div class="mark" id="brand-icon"></div><div><b>行测计时</b><small></small></div></div><nav class="nav" aria-label="主导航"><button data-page="timer" class="active">计时</button><button data-page="history">记录</button><button data-page="stats">统计</button></nav></header>
<main>
<section id="timer" class="page active"><div class="page-heading"><div><div class="eyebrow">FOCUS TIMER</div><h1>模考计时</h1></div></div>
<div class="layout"><div class="card timer-card"><div class="timer-top"><span class="badge" id="status"><i class="dot"></i><span>准备开始</span></span><button class="text-button" id="settings">120 分钟 · 设置</button></div>
<div class="dial"><svg viewBox="0 0 300 300" aria-hidden="true"><circle class="track" cx="150" cy="150" r="140"/><circle class="progress" id="progress" cx="150" cy="150" r="140" stroke-dasharray="879.646" stroke-dashoffset="0"/></svg><div class="dial-center"><span class="timer-label" id="remaining-label">总剩余时间</span><div class="time" id="remaining">120:00</div><span class="badge" id="current-module">政治理论</span></div></div>
<div class="timer-bottom"><div><span class="sub">本次已用</span><strong id="elapsed">00:00</strong></div><div><span class="sub" id="module-label">模块剩余</span><strong id="module-remaining">10:00</strong></div></div>
<div class="controls"><button id="toggle" class="primary">开始计时</button><button id="finish" class="secondary" disabled>结束并保存</button></div><div class="hint" id="screen-hint">计时中屏幕常亮</div></div>
<div class="card modules-card"><div class="section-head"><h2>分模块计时</h2><span>点击切换 · 自动累计</span></div><div class="module-list" id="modules"></div></div></div></section>
<section id="history" class="page"><div class="page-heading"><div><div class="eyebrow">YOUR SESSIONS</div><h1>做题记录</h1></div><span class="sub" id="history-count"></span></div><div id="records"></div></section>
<section id="stats" class="page"><div class="page-heading"><div><div class="eyebrow">TIME INSIGHTS</div><h1>用时统计</h1></div></div><div id="stats-content"></div></section>
<section id="detail" class="page"><div class="page-heading"><button class="back" id="back-history">‹ 返回记录</button></div><div class="page-heading"><div><h1 id="detail-title"></h1><div class="sub" id="detail-date" style="margin-top:8px"></div></div></div><div id="detail-content"></div><div class="detail-actions"><span class="sub">本次各模块实际用时</span><button class="danger" id="delete-record">删除记录</button></div></section>
</main>
<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" id="dialog"></div></div><div role="status" id="toast"></div>
<script>
'use strict';
const names=['政治理论','常识判断','言语理解','数量关系','判断推理','资料分析'];
const colors=['#4f70e8','#40b9b4','#a589d9','#e7ae59','#e67e91','#63a3d9'];
const clockIcon='<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M9 2h6m-3 0v3m6 1 2-2M12 8v5l-3 3"/></svg>';
document.getElementById('brand-icon').innerHTML=clockIcon;
const $=id=>document.getElementById(id),sum=a=>a.reduce((a,b)=>a+b,0),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(ms,up=false){let sec=Math.max(0,up?Math.ceil(ms/1000):Math.floor(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function dateText(t){const d=new Date(t);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}  ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
// Browser adapter is for preview only. Installed Android builds always use Native.
const native=typeof Native!=='undefined';
let preview=JSON.parse(localStorageSafe('preview')||'null')||{spent:[0,0,0,0,0,0],budgets:[10,10,35,15,30,20].map(x=>x*60000),active:0,running:false,startedAt:0,anchor:Date.now()},previewHistory=JSON.parse(localStorageSafe('previewHistory')||'[]');
function localStorageSafe(k){if(native)return null;try{return localStorage.getItem(k)}catch(e){return null}}
function previewSnapshot(){const p=JSON.parse(JSON.stringify(preview));if(p.running)p.spent[p.active]+=Math.max(0,Date.now()-p.anchor);return p}
function read(){return native?JSON.parse(Native.snapshot()):previewSnapshot()}
function history(){return native?JSON.parse(Native.history()):previewHistory}
function action(name,payload=''){
 let err='';if(native)err=Native.action(name,String(payload));else{
 const p=previewSnapshot();p.anchor=Date.now();preview=p;
 if(name==='start'){p.running=true;if(!p.startedAt)p.startedAt=Date.now()}
 if(name==='pause')p.running=false;
 if(name==='select')p.active=Number(payload);
 if(name==='configure')p.budgets=JSON.parse(payload);
 if(name==='finish'){previewHistory.unshift({id:String(Date.now()),title:payload||'行测模考',date:p.startedAt,spent:p.spent.slice(),budgets:p.budgets.slice()});p.running=false;p.startedAt=0;p.spent=[0,0,0,0,0,0];p.active=0}
 if(name==='discard'){p.running=false;p.startedAt=0;p.spent=[0,0,0,0,0,0];p.active=0}
 if(name==='delete')previewHistory=previewHistory.filter(r=>r.id!==payload);
 try{localStorage.setItem('preview',JSON.stringify(preview));localStorage.setItem('previewHistory',JSON.stringify(previewHistory))}catch(e){err='浏览器存储不可用'}
 }if(err){toast(err);return false}refresh();return true;
}
let currentPage='timer',detailId=null,toastHandle;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastHandle);toastHandle=setTimeout(()=>$('toast').style.display='none',3000)}
function page(id){closeDialog();currentPage=id;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===(id==='detail'?'history':id)));if(id==='history')renderHistory();if(id==='stats')renderStats();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>page(e.dataset.page));
$('modules').innerHTML=names.map((n,i)=>`<button class="module" style="--c:${colors[i]}" data-module="${i}" aria-label="切换到${n}"><span class="number">0${i+1}</span><div><b>${n}</b><small id="module-state-${i}">等待开始</small></div><div class="value"><span id="time-${i}">00:00</span><small id="budget-${i}"></small></div><div class="bar"><i id="bar-${i}" style="width:0"></i></div></button>`).join('');
document.querySelectorAll('[data-module]').forEach(e=>e.onclick=()=>action('select',e.dataset.module));
function refresh(){
 const s=read(),spent=sum(s.spent),remaining=sum(s.budgets)-spent,m=s.budgets[s.active]-s.spent[s.active];
 $('remaining').textContent=fmt(Math.abs(remaining),remaining>=0);$('remaining').classList.toggle('overtime',remaining<0);$('remaining-label').textContent=remaining<0?'总超时时间':'总剩余时间';
 $('elapsed').textContent=fmt(spent);$('module-remaining').textContent=fmt(Math.abs(m),m>=0);$('module-remaining').classList.toggle('overtime',m<0);$('module-label').textContent=m<0?'模块超时':'模块剩余';
 $('current-module').textContent=names[s.active];$('current-module').style.color=colors[s.active];
 $('progress').style.strokeDashoffset=879.646*Math.min(1,Math.max(0,spent/sum(s.budgets)));$('progress').style.stroke=remaining<0?'var(--red)':'var(--blue)';
 $('status').classList.toggle('running',s.running);$('status').lastElementChild.textContent=s.running?'专注计时中':s.startedAt?'已暂停':'准备开始';
 $('toggle').textContent=s.running?'暂停计时':s.startedAt?'继续计时':'开始计时';$('finish').disabled=!s.startedAt;$('settings').textContent=`${sum(s.budgets)/60000} 分钟 · 设置`;$('settings').disabled=!!s.startedAt;
 names.forEach((n,i)=>{const selected=s.active===i;const el=document.querySelector(`[data-module="${i}"]`);el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected));$('time-'+i).textContent=fmt(s.spent[i]);$('budget-'+i).textContent=`/ ${s.budgets[i]/60000} 分钟`;$('bar-'+i).style.width=Math.min(100,s.spent[i]/s.budgets[i]*100)+'%';$('module-state-'+i).textContent=selected?(s.running?'正在计时':s.startedAt?'当前模块 · 已暂停':'当前模块'):s.spent[i]>0?'已记录 · 可继续':'等待开始';$('time-'+i).classList.toggle('overtime',s.spent[i]>s.budgets[i]);});
}
$('toggle').onclick=()=>action(read().running?'pause':'start');
let lastFocus=null;
function dialog(html){lastFocus=document.activeElement;$('dialog').innerHTML=html;$('overlay').classList.add('open');setTimeout(()=>{const el=$('dialog').querySelector('input,button');if(el)el.focus()},30)}
function closeDialog(){$('overlay').classList.remove('open');if(lastFocus){lastFocus.focus();lastFocus=null}}
function confirmDialog(title,body,ok,onOk){dialog(`<h2 id="dialog-title">${title}</h2><p>${body}</p><div class="actions"><button class="secondary" id="cancel-dialog">取消</button><button class="primary" id="confirm-dialog">${ok}</button></div>`);$('cancel-dialog').onclick=closeDialog;$('confirm-dialog').onclick=()=>{closeDialog();onOk()}}
$('finish').onclick=()=>{
 // Pause while naming/saving so confirmation time does not inflate the record.
 const wasRunning=read().running;action('pause');
 dialog('<h2 id="dialog-title">保存这次专注</h2><p>计时已暂停。给本次记录起个名字，方便日后回顾。</p><label for="session-name" class="sr-only">记录名称</label><input class="wide" id="session-name" maxlength="40" placeholder="行测模考（可选）"><div class="actions"><button class="secondary" id="cancel-finish">返回计时</button><button class="primary" id="save-finish">保存记录</button></div>');
 $('cancel-finish').onclick=()=>{closeDialog();if(wasRunning)action('start')};$('save-finish').onclick=()=>{const name=$('session-name').value.trim();if(action('finish',name)){closeDialog();detailId=history()[0].id;showDetail(detailId);toast('记录已保存在本机')}};
};
function allocate(total){const ratios=[10,10,35,15,30,20],base=ratios.map(r=>Math.max(1,Math.floor(total*r/120)));let delta=total-sum(base);while(delta>0){for(let i of [2,4,5,3,0,1])if(delta>0){base[i]++;delta--}}while(delta<0){let k=base.indexOf(Math.max(...base));base[k]--;delta++}return base}
$('settings').onclick=()=>{
 const s=read();if(s.startedAt)return;
 dialog(`<h2 id="dialog-title">设置练习时间</h2><p>总时长与六个模块的目标时长，可自由调整。</p><div class="preset"><button id="preset120">120 分钟</button><button id="preset90">90 分钟</button></div><label>总时长（分钟）<input type="number" inputmode="numeric" id="total-input" min="6" max="600" value="${sum(s.budgets)/60000}"></label><div class="budget-fields">${names.map((n,i)=>`<label>${n}<input type="number" inputmode="numeric" class="budget-input" min="1" max="600" value="${s.budgets[i]/60000}" aria-label="${n}目标分钟"></label>`).join('')}</div><div class="budget-error" id="budget-error" role="status"></div><div class="actions"><button class="secondary" id="cancel-settings">取消</button><button class="primary" id="save-settings">保存设置</button></div>`);
 const inputs=()=>[...document.querySelectorAll('.budget-input')];
 function validate(){const total=Number($('total-input').value),vals=inputs().map(e=>Number(e.value)),valid=Number.isInteger(total)&&total>=6&&total<=600&&vals.every(v=>Number.isInteger(v)&&v>=1&&v<=600)&&sum(vals)===total;$('save-settings').disabled=!valid;$('budget-error').textContent=valid?'':`各模块合计 ${sum(vals)} 分钟，须与总时长一致（6–600 分钟）`;return valid}
 function setTotal(n){if(Number.isInteger(n)&&n>=6&&n<=600){$('total-input').value=n;allocate(n).forEach((v,i)=>inputs()[i].value=v)}validate()}
 $('total-input').oninput=()=>setTotal(Number($('total-input').value));inputs().forEach(e=>e.oninput=validate);$('preset120').onclick=()=>setTotal(120);$('preset90').onclick=()=>setTotal(90);$('cancel-settings').onclick=closeDialog;$('save-settings').onclick=()=>{if(validate()&&action('configure',JSON.stringify(inputs().map(e=>Number(e.value)*60000))))closeDialog()};validate();
};
function empty(title,text){return `<div class="card empty"><div class="empty-icon">${clockIcon}</div><h2>${title}</h2><p>${text}</p><button class="text-button" id="go-timer">开始一次练习 →</button></div>`}
function attachEmpty(){if($('go-timer'))$('go-timer').onclick=()=>page('timer')}
function renderHistory(){const rows=history();$('history-count').textContent=`${rows.length} 次练习`;$('records').innerHTML=rows.length?`<div class="record-list">${rows.map(r=>`<button class="record" data-record="${escapeHtml(r.id)}"><div><h3>${escapeHtml(r.title)}</h3><p>${dateText(r.date)} · 目标 ${sum(r.budgets)/60000} 分钟</p></div><div class="record-right"><div><div class="record-time">${fmt(sum(r.spent))}</div><em>查看用时分布</em></div><span style="color:#b0bbcf">›</span></div></button>`).join('')}</div>`:empty('还没有练习记录','结束并保存一次计时后，<br>你的每一分投入都会留在这里。');document.querySelectorAll('[data-record]').forEach(e=>e.onclick=()=>showDetail(e.dataset.record));attachEmpty()}
function pie(values){const total=sum(values);if(total<=0)return '<div class="no-data">本次暂无可统计用时</div>';let angle=-Math.PI/2;let paths='';values.forEach((v,i)=>{if(!v)return;const a=angle;angle+=v/total*Math.PI*2;const x=130+106*Math.cos(a),y=130+106*Math.sin(a),ex=130+106*Math.cos(angle),ey=130+106*Math.sin(angle);paths+=v===total?`<circle cx="130" cy="130" r="106" fill="${colors[i]}"><title>${names[i]} ${fmt(v)}</title></circle>`:`<path d="M130 130 L${x} ${y} A106 106 0 ${v/total>.5?1:0} 1 ${ex} ${ey} Z" fill="${colors[i]}" stroke="white" stroke-width="2"><title>${names[i]} ${fmt(v)} · ${(v/total*100).toFixed(1)}%</title></path>`});return `<div class="pie-wrap"><svg viewBox="0 0 260 260" role="img" aria-label="六模块实际用时扇形图">${paths}</svg></div>`}
function chart(values){const total=sum(values);return `<div class="chart-layout">${pie(values)}<div class="legend">${names.map((n,i)=>`<div class="legend-row"><span class="legend-name"><i class="swatch" style="background:${colors[i]}"></i>${n}</span><span><b>${fmt(values[i])}</b><small>${total?(values[i]/total*100).toFixed(1):'0.0'}%</small></span></div>`).join('')}</div></div>`}
function renderStats(){const rows=history();if(!rows.length){$('stats-content').innerHTML=empty('用时间，了解自己','保存练习记录后，<br>在这里查看六个模块的平均用时分布。');attachEmpty();return}const avg=names.map((_,i)=>rows.reduce((n,r)=>n+r.spent[i],0)/rows.length);$('stats-content').innerHTML=`<div class="stats-summary"><div class="card stat"><span class="sub">累计练习</span><strong>${rows.length}<small>次</small></strong></div><div class="card stat"><span class="sub">单次平均总用时</span><strong>${fmt(sum(avg))}</strong></div></div><div class="card chart-card"><h2>各模块平均用时</h2>${chart(avg)}<p class="chart-note">按全部 ${rows.length} 次已保存记录计算；未练习的模块按 0 计入平均。时间格式为 分:秒。</p></div>`}
function showDetail(id){detailId=id;const r=history().find(x=>x.id===id);if(!r){page('history');return}page('detail');$('detail-title').textContent=r.title;$('detail-date').textContent=dateText(r.date);const elapsed=sum(r.spent),target=sum(r.budgets);$('detail-content').innerHTML=`<div class="card chart-card"><div class="detail-meta"><div><span class="sub">实际用时</span><strong>${fmt(elapsed)}</strong></div><div><span class="sub">目标时长</span><strong>${target/60000}<span class="sub"> 分钟</span></strong></div><div><span class="sub">${elapsed>target?'超时':'剩余'}</span><strong class="${elapsed>target?'overtime':''}">${fmt(Math.abs(target-elapsed))}</strong></div></div><h2>本次用时分布</h2>${chart(r.spent)}<p class="chart-note">${names.map((n,i)=>`${n}目标 ${r.budgets[i]/60000} 分钟`).join(' · ')}<br>时间格式为 分:秒，暂停时间不计入。</p></div>`}
$('back-history').onclick=()=>page('history');$('delete-record').onclick=()=>confirmDialog('删除这条记录？','删除后无法恢复，平均用时统计会同步更新。','删除',()=>{if(action('delete',detailId)){page('history');toast('记录已删除')}});
window.handleBack=()=>{if($('overlay').classList.contains('open')){closeDialog();return}if(currentPage==='detail'){page('history');return}if(currentPage!=='timer'){page('timer');return}if(native)Native.minimize()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.handleBack();if(e.key==='Tab'&&$('overlay').classList.contains('open')){const f=[...$('dialog').querySelectorAll('button:not(:disabled),input')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}});
refresh();setInterval(refresh,250);
</script></body></html>
